# Build a model's docker image and publish it to GHCR. Publishing is always deliberate, never a side effect of main:
#   - release: bump VERSION in models/<model>/model.env (+ CHANGELOG.md), then push the tag "<model>/v<VERSION>",
#     e.g.  git tag inkling2-mini/v0.2.0 && git push origin inkling2-mini/v0.2.0
#     -> :<model>-vX.Y.Z, :<model>-vX.Y, :<model> (latest release), :<model>-<vllm commit>
#   - dev build: Actions -> image -> Run workflow (model) -> :<model>-dev-<short sha> only (never moves latest)
name: image

on:
  push:
    tags: ["*/v*"]
  workflow_dispatch:
    inputs:
      model:
        description: "model directory under models/"
        required: true
        default: inkling2-mini

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}-${{ inputs.model || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Resolve model and version
        id: v
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          IN_MODEL: ${{ inputs.model }}
        run: |
          if [ -n "$TAG" ]; then model=${TAG%%/*}; version=${TAG#*/}; release=true
          else model=$IN_MODEL; version=dev-${GITHUB_SHA::7}; release=false; fi
          [[ $model =~ ^[a-z0-9][a-z0-9._-]*$ ]] || { echo "bad model name: '$model'"; exit 1; }
          echo "model=$model" >> "$GITHUB_OUTPUT"; echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vllm-redshift" >> "$GITHUB_OUTPUT"

      # The image is ~18.6 GB unpacked (ROCm SDK + torch); a stock runner has ~14 GB free.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/share/powershell /usr/share/swift /opt/microsoft "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -af >/dev/null
          df -h /

      - uses: actions/checkout@v4

      - name: Check the release tag against model.env
        if: steps.v.outputs.release == 'true'
        run: |
          [ -f models/${{ steps.v.outputs.model }}/model.env ] || { echo "no models/${{ steps.v.outputs.model }}"; exit 1; }
          want=$(. models/${{ steps.v.outputs.model }}/model.env; echo "v$VERSION")
          [[ $want =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "model.env VERSION is not semver: $want"; exit 1; }
          [ "${{ steps.v.outputs.version }}" = "$want" ] \
            || { echo "tag says ${{ steps.v.outputs.version }} but model.env says $want: bump VERSION first"; exit 1; }
          grep -q "^## $want " models/${{ steps.v.outputs.model }}/CHANGELOG.md \
            || { echo "no '## $want' entry in models/${{ steps.v.outputs.model }}/CHANGELOG.md"; exit 1; }

      - name: Fetch the pinned vLLM commit (shallow)
        run: git submodule update --init --depth 1 vllm

      - name: Prepare build context (vLLM + patch series)
        id: ctx
        run: |
          [ -f models/${{ steps.v.outputs.model }}/model.env ] || { echo "no models/${{ steps.v.outputs.model }}"; exit 1; }
          . models/${{ steps.v.outputs.model }}/model.env
          scripts/build-context.sh ${{ steps.v.outputs.model }} > build-args.txt
          cat build-args.txt
          { echo "args<<EOF"; cat build-args.txt; echo "EOF"; } >> "$GITHUB_OUTPUT"
          echo "vllm=${VLLM_COMMIT::10}" >> "$GITHUB_OUTPUT"

      - name: Image tags
        id: tags
        env:
          R: ${{ steps.v.outputs.repo }}
          M: ${{ steps.v.outputs.model }}
          V: ${{ steps.v.outputs.version }}
        run: |
          {
            echo "list<<EOF"; echo "$R:$M-$V"
            if [ "${{ steps.v.outputs.release }}" = true ]; then
              echo "$R:$M-${V%.*}"; echo "$R:$M"; echo "$R:$M-${{ steps.ctx.outputs.vllm }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: build/${{ steps.v.outputs.model }}/src
          file: docker/Dockerfile.rocm-gfx1201
          build-args: |
            MAX_JOBS=4
            ${{ steps.ctx.outputs.args }}
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.v.outputs.model }}-${{ steps.v.outputs.version }}
            org.opencontainers.image.description=vLLM for 1x Radeon AI PRO R9700 (gfx1201): ${{ steps.v.outputs.model }}
          # registry cache: the ROCm/torch layers (~9 GB) are reused across builds; GHA's 10 GB cache is too small
          cache-from: type=registry,ref=${{ steps.v.outputs.repo }}:buildcache-${{ steps.v.outputs.model }}
          cache-to: type=registry,ref=${{ steps.v.outputs.repo }}:buildcache-${{ steps.v.outputs.model }},mode=max

      - name: Summary
        run: |
          {
            echo "### ${{ steps.v.outputs.repo }}:${{ steps.v.outputs.model }}-${{ steps.v.outputs.version }}"
            echo "tags:"; echo '${{ steps.tags.outputs.list }}' | sed 's/^/- /'
            echo "vLLM \`${{ steps.ctx.outputs.vllm }}\`, patches: \`$(. models/${{ steps.v.outputs.model }}/model.env; echo $PATCHES)\`"
            echo
            echo "\`\`\`"
            echo "docker pull ${{ steps.v.outputs.repo }}:${{ steps.v.outputs.model }}-${{ steps.v.outputs.version }}"
            echo "IMAGE=${{ steps.v.outputs.repo }}:${{ steps.v.outputs.model }}-${{ steps.v.outputs.version }} scripts/serve.sh ${{ steps.v.outputs.model }}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
