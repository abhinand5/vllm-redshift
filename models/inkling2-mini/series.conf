# Patch series for inkling2-mini: how each patch in patches/ is cut from the dev clone.
# One line per patch, applied in this order on top of VLLM_COMMIT:
#   <patch path under patches/> | <from rev> | <to rev> | <pathspec, space separated; "." = everything>
# BRANCH is replaced by the dev branch given to scripts/export-series.sh. The upstream PRs are fixed revisions; our
# patches are all cut from OURS_BASE (upstream PRs merged) to the dev branch, split by path. export-series.sh checks
# that the split covers every path changed in OURS_BASE..BRANCH and that the series rebuilds the branch's tree exactly.
OURS_BASE=b6faecc59a

# --- upstream PRs, not yet merged in vllm-project/vllm (drop a patch when its PR lands in VLLM_COMMIT) ---
upstream/0001-pr67685-inkling2-small-rocm.patch | bf151b7eb1 | 4a04dcaefb | .
upstream/0002-pr69028-inkling2-mini.patch       | 4a04dcaefb | b6faecc59a | .

# --- generic vLLM fixes (not Inkling-specific; candidates to upstream) ---
core/0101-rocm-rdna4-gpu-max-hw-queues.patch       | OURS_BASE | BRANCH | vllm/platforms/rocm.py
core/0102-config-gfx12-bringup.patch               | OURS_BASE | BRANCH | vllm/config/vllm.py
core/0103-v1-tail-sliding-window-manager.patch     | OURS_BASE | BRANCH | vllm/v1/core/single_type_kv_cache_manager.py
core/0104-gpu-runner-adaptive-verify-profile.patch | OURS_BASE | BRANCH | vllm/v1/worker/gpu/model_runner.py

# --- the Inkling2 AMD backend for gfx1201 (to become an out-of-tree plugin) ---
model/0201-inkling2-amd-gfx1201.patch | OURS_BASE | BRANCH | vllm/models
model/0202-inkling2-amd-tests.patch   | OURS_BASE | BRANCH | tests
